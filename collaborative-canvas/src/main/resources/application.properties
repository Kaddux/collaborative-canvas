spring.application.name=collaborative-canvas

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/collaborative_canvas?options=-c%20TimeZone%3DUTC}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Kafka: durable canvas-operations log (audit/replay only, not correctness path) ──
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
# Bound the metadata wait so a broker outage cannot hang the (offloaded) publisher thread.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.consumer.group-id=collaborative-canvas-history
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.collaborative_canvas.websocket.CanvasOperationEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.collaborative_canvas.websocket

# ── WebSocket allowed origins (comma-separated). Override in production, e.g.
#    WEBSOCKET_ALLOWED_ORIGINS=https://your-domain ──
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
