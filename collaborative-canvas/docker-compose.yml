services:
  postgres:
    image: postgres:16
    container_name: collaborative-canvas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: collaborative_canvas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - collaborative_canvas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collaborative_canvas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  collaborative_canvas_postgres_data:
